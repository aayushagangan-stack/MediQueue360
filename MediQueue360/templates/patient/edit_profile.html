{% extends "base.html" %}

{% block title %}
Edit Profile | MediQueue 360
{% endblock %}

{% block content %}

<div class="patient-profile-card edit-profile-card">

    <div class="patient-profile-body">

        <div class="text-center mb-4">

            <div class="profile-icon mb-3">
                <i class="bi bi-person-circle"></i>
            </div>

            <h3 class="profile-title mb-1">
                Edit Profile
            </h3>

            <p class="text-muted mb-0">
                Update your personal information.
            </p>

        </div>


        <form method="POST" action="{{ url_for('patient.edit_profile') }}">


            <!-- Full Name -->

            <div class="mb-4">

                <label for="full_name" class="form-label">
                    Full Name
                </label>

                <input type="text" id="full_name" name="full_name" class="form-control profile-form-control"
                    value="{{ current_user.full_name }}" required>

            </div>


            <!-- Email -->

            <div class="mb-4">

                <label for="email" class="form-label">
                    Email Address
                </label>

                <input type="email" id="email" class="form-control profile-form-control"
                    value="{{ current_user.email }}" disabled>

                <small class="text-muted">
                    Email address cannot be changed.
                </small>

            </div>


            <!-- Phone -->

            <div class="mb-4">

                <label for="phone" class="form-label">
                    Phone Number
                </label>

                <input type="tel" id="phone" name="phone" class="form-control profile-form-control"
                    value="{{ current_user.phone or '' }}" placeholder="Enter your phone number">

            </div>

            <!-- Date of Birth -->

            <div class="mb-4">

                <label for="date_of_birth" class="form-label">
                    Date of Birth
                </label>

                <input type="date" id="date_of_birth" name="date_of_birth" class="form-control profile-form-control"
                    value="{{ patient_data.date_of_birth or '' }}">

            </div>


            <!-- Gender -->

            <div class="mb-4">

                <label for="gender" class="form-label">
                    Gender
                </label>

                <select id="gender" name="gender" class="form-select profile-form-control">

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male" {% if patient_data.gender=="Male" %}selected{% endif %}>
                        Male
                    </option>

                    <option value="Female" {% if patient_data.gender=="Female" %}selected{% endif %}>
                        Female
                    </option>

                    <option value="Other" {% if patient_data.gender=="Other" %}selected{% endif %}>
                        Other
                    </option>

                </select>

            </div>


            <!-- Address -->

            <div class="mb-4">

                <label for="address" class="form-label">
                    Address
                </label>

                <input type="text" id="address" name="address" class="form-control profile-form-control"
                    value="{{ patient_data.address or '' }}" placeholder="Enter your address">

            </div>


            <!-- Emergency Contact -->

            <div class="mb-4">

                <label for="emergency_contact" class="form-label">
                    Emergency Contact
                </label>

                <input type="tel" id="emergency_contact" name="emergency_contact"
                    class="form-control profile-form-control" value="{{ patient_data.emergency_contact or '' }}"
                    placeholder="Enter emergency contact number">

            </div>

            <!-- Buttons -->

            <div class="profile-actions mt-5">

                <a href="{{ url_for('patient.profile') }}" class="btn btn-primary">
                    <i class="bi bi-arrow-left me-1"></i>
                    Cancel
                </a>


                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check2 me-1"></i>
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
