{% extends "base.html" %}

{% block title %}
Consult Patient
{% endblock %}

{% block content %}

<div class="appointment-header">

    <div>
        <h2 class="section-title mb-1">
            Patient Consultation
        </h2>

        <p class="text-muted mb-0">
            Enter consultation details for this patient.
        </p>
    </div>

    <div class="appointment-header-actions">

        <a
            href="{{ url_for('doctor.appointments') }}"
            class="btn btn-primary"
        >
            <i class="bi bi-arrow-left me-1"></i>
            Back to Appointments
        </a>

    </div>

</div>


<div class="consultation-card">

    <div class="consultation-card-body">

        <div class="consultation-heading">

            <div class="consultation-icon">
                <i class="bi bi-clipboard2-pulse"></i>
            </div>

            <div>
                <h4 class="mb-1">
                    Consultation Details
                </h4>

                <p class="text-muted mb-0">
                    Record the patient's symptoms, diagnosis and treatment.
                </p>
            </div>

        </div>


        <form method="POST">

            <!-- Symptoms -->

            <div class="consultation-field">

                <label for="symptoms" class="form-label">
                    Symptoms
                </label>

                <textarea
                    id="symptoms"
                    class="form-control consultation-input"
                    name="symptoms"
                    rows="4"
                    placeholder="Enter patient's symptoms..."
                    required
                ></textarea>

            </div>


            <!-- Diagnosis -->

            <div class="consultation-field">

                <label for="diagnosis" class="form-label">
                    Diagnosis
                </label>

                <textarea
                    id="diagnosis"
                    class="form-control consultation-input"
                    name="diagnosis"
                    rows="4"
                    placeholder="Enter diagnosis..."
                    required
                ></textarea>

            </div>


            <!-- Prescription -->

            <div class="consultation-field">

                <label for="prescription" class="form-label">
                    Prescription
                </label>

                <textarea
                    id="prescription"
                    class="form-control consultation-input"
                    name="prescription"
                    rows="4"
                    placeholder="Enter prescribed medicines or treatment..."
                    required
                ></textarea>

            </div>


            <!-- Doctor Notes -->

            <div class="consultation-field">

                <label for="doctor_notes" class="form-label">
                    Doctor Notes
                </label>

                <textarea
                    id="doctor_notes"
                    class="form-control consultation-input"
                    name="doctor_notes"
                    rows="4"
                    placeholder="Add any additional notes..."
                ></textarea>

            </div>


            <!-- Follow-up Date -->

            <div class="consultation-field">

                <label for="follow_up_date" class="form-label">
                    Follow-up Date
                </label>

                <input
                    type="date"
                    id="follow_up_date"
                    class="form-control consultation-input"
                    name="follow_up_date"
                >

            </div>


            <!-- Actions -->

            <div class="consultation-actions">

                <a
                    href="{{ url_for('doctor.appointments') }}"
                    class="btn btn-outline-secondary"
                >
                    <i class="bi bi-x-lg me-1"></i>
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-success"
                >
                    <i class="bi bi-check2-circle me-1"></i>
                    Save Consultation
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
