{% extends "base.html" %}

{% block title %}
Login | MediQueue 360
{% endblock %}

{% block content %}

<section class="login-section">

<div class="login-bubble login-bubble-one"></div>
<div class="login-bubble login-bubble-two"></div>
<div class="login-bubble login-bubble-three"></div>
<div class="login-bubble login-bubble-four"></div>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-12">

            <div class="login-card">

                <div class="login-icon">
                    <i class="bi bi-heart-pulse-fill"></i>
                </div>

                <div class="text-center login-heading">

                    <span class="login-tag">
                        WELCOME BACK
                    </span>

                    <h1>
                        Login to MediQueue 360
                    </h1>

                    <p>
                        Access your account and manage your clinic appointments with ease.
                    </p>

                </div>

                <form method="POST">

                    <div class="login-field">

                        <label for="email">
                            Email Address
                        </label>

                        <div class="login-input-wrapper">

                            <i class="bi bi-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                required
                            >

                        </div>

                    </div>

                    <div class="login-field">

                        <label for="password">
                            Password
                        </label>

                        <div class="login-input-wrapper">

                            <i class="bi bi-lock"></i>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                onclick="togglePassword()"
                                aria-label="Show password"
                            >

                                <i class="bi bi-eye"></i>

                            </button>

                        </div>

                    </div>

                    <button
                        type="submit"
                        class="login-button"
                    >

                        Login

                        <i class="bi bi-arrow-right"></i>

                    </button>

                </form>

                <div class="login-register">

                    <p>
                        Don't have an account?
                    </p>

                    <a href="{{ url_for('auth.register') }}">
                        Create an account
                        <i class="bi bi-arrow-right"></i>
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</section>

<script>

function togglePassword() {

    const passwordInput = document.getElementById("password");
    const toggleIcon = document.querySelector(".password-toggle i");

    if (passwordInput.type === "password") {

        passwordInput.type = "text";

        toggleIcon.classList.remove("bi-eye");
        toggleIcon.classList.add("bi-eye-slash");

    } else {

        passwordInput.type = "password";

        toggleIcon.classList.remove("bi-eye-slash");
        toggleIcon.classList.add("bi-eye");

    }

}

</script>

{% endblock %}
